networks:
  frontend:
    driver: ${NETWORKS_DRIVER}
  backend:
    driver: ${NETWORKS_DRIVER}
volumes:
  docker-in-docker:
    driver: ${VOLUMES_DRIVER}

# Trimmed to only the services this project actually uses (nginx, mysql,
# redis, phpmyadmin, mailpit, workspace, php-fpm, docker-in-docker — the last
# two are dependencies pulled in automatically by nginx/workspace, not opted
# into directly). This is what lets a plain `docker compose up -d`, with no
# service names, "just work" here.
#
# Upstream Laradock ships 100+ optional services (databases, message queues,
# AI tooling, etc.) in this same include list. None of them are used by this
# project. The untouched original catalog is kept at `docker-compose.full.yml`
# — if you ever need one of those services, add its entry back here (or run
# `docker compose -f docker-compose.full.yml up -d <service>` directly) rather
# than switching this file back wholesale.
include:
  - path: docker-in-docker/compose.yml
    project_directory: .
  - path: mailpit/compose.yml
    project_directory: .
    env_file: mailpit/defaults.env
  - path: mysql/compose.yml
    project_directory: .
    env_file: mysql/defaults.env
  - path: nginx/compose.yml
    project_directory: .
    env_file: nginx/defaults.env
  - path: php-fpm/compose.yml
    project_directory: .
    env_file: php-fpm/defaults.env
  - path: phpmyadmin/compose.yml
    project_directory: .
    env_file: phpmyadmin/defaults.env
  - path: redis/compose.yml
    project_directory: .
    env_file: redis/defaults.env
  - path: workspace/compose.yml
    project_directory: .
    env_file: workspace/defaults.env
