server {

    listen 80;
    listen [::]:80;

    server_name localhost _;
    root /var/www/public;
    index index.php index.html index.htm;

    charset utf-8;
    client_max_body_size 64m;

    # Hashed SPA build output (public/app/assets/*.js|css, created by
    # `make deploy-spa`) never changes content under the same filename —
    # cache it for a year. Falls through untouched until that directory
    # exists; Laravel/SpaController handles the redirect-to-Vite-dev-server
    # fallback described in the project README until then.
    location ^~ /app/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri /index.php =404;
        fastcgi_pass php-upstream;
        fastcgi_index index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 600;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt/;
        log_not_found off;
    }

    error_log /var/log/nginx/nihongo_error.log;
    access_log /var/log/nginx/nihongo_access.log;
}
