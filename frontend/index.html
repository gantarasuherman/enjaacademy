<!doctype html>
<html lang="id" class="scroll-smooth">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="theme-color" content="#02468B" />

        <title>English Academy — Belajar Bahasa Inggris dari Nol sampai Mahir</title>
        <meta
            name="description"
            content="Platform belajar Bahasa Inggris terstruktur: vocabulary, grammar, listening, speaking, reading, writing, conversation, quiz, dan flashcard dengan pelacakan progres."
        />

        <meta property="og:type" content="website" />
        <meta property="og:title" content="English Academy — Belajar Bahasa Inggris" />
        <meta
            property="og:description"
            content="Belajar Bahasa Inggris terstruktur dengan quiz interaktif, flashcard spaced repetition, dan pelacakan progres."
        />
        <meta name="twitter:card" content="summary_large_image" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />

        <script>
            // Applied before first paint so a dark-mode reload never flashes white.
            (() => {
                const stored = localStorage.getItem('ea.theme');
                const prefers = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (stored === 'dark' || ((!stored || stored === 'system') && prefers)) {
                    document.documentElement.classList.add('dark');
                }
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
